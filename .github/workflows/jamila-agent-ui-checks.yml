name: Jamila GitHub MCP and agent UI checks

on:
  push:
    branches: [Main]
    paths:
      - "webview-ui/**"
      - "src/services/mcp/**"
      - "src/core/controller/file/**"
      - "src/core/agents/**"
      - "src/core/task/**"
      - "proto/**"
      - ".github/workflows/jamila-agent-ui-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jamila-agent-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
      - name: Install extension dependencies
        run: npm ci
      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui
      - name: Check extension TypeScript
        run: npm run check-types
      - name: Test Godot agent routing and MCP credential references
        run: |
          TS_NODE_PROJECT=./tsconfig.unit-test.json npx mocha --no-config --no-package \
            --require ts-node/register --require tsconfig-paths/register \
            src/services/mcp/__tests__/environment.test.ts \
            src/core/agents/__tests__/godotAgents.test.ts
      - name: Build webview
        run: npm run build
        working-directory: webview-ui
      - name: Test webview components
        run: npm test
        working-directory: webview-ui
