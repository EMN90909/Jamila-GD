syntax = "proto3";

package host;
option java_package = "bot.jam.host.proto";
option java_multiple_files = true;

import "common.proto";

// Provides methods for working with the user's environment.
service EnvService {
  // Writes text to the system clipboard.
  rpc clipboardWriteText(jam.StringRequest) returns (jam.Empty);

  // Reads text from the system clipboard.
  rpc clipboardReadText(jam.EmptyRequest) returns (jam.String);
}
